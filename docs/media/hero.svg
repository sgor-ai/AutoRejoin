<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Auto Rejoin server queue illustration</title>
  <desc id="desc">A Minecraft-inspired server queue card changing from full to ready.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#183b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#62e6a7"/>
      <stop offset="1" stop-color="#44b7ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#061018" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="180" fill="#3dd5a0" opacity=".08"/>
  <circle cx="150" cy="470" r="230" fill="#4db5e8" opacity=".08"/>
  <g opacity=".18" fill="#8ff4c6">
    <path d="M74 84h20v20H74zm28 0h20v20h-20zM74 112h20v20H74zm28 0h20v20h-20z"/>
    <path d="M1050 402h20v20h-20zm28 0h20v20h-20zm-28 28h20v20h-20zm28 28h20v20h-20z"/>
  </g>
  <g transform="translate(100 92)">
    <rect width="1000" height="336" rx="24" fill="#132536" stroke="#39596d" stroke-width="2" filter="url(#shadow)"/>
    <rect width="1000" height="74" rx="24" fill="#1c3447"/>
    <circle cx="38" cy="37" r="10" fill="#62e6a7"/>
    <text x="66" y="45" fill="#effff8" font-family="Arial, sans-serif" font-size="25" font-weight="700">AUTO REJOIN</text>
    <text x="760" y="44" fill="#8ba9ba" font-family="Arial, sans-serif" font-size="16">CLIENT-SIDE FABRIC MOD</text>
    <g transform="translate(42 112)">
      <rect width="420" height="156" rx="16" fill="#0d1a27"/>
      <text x="26" y="38" fill="#8ba9ba" font-family="Arial, sans-serif" font-size="16">SERVER STATUS</text>
      <text x="26" y="78" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">play.example.net</text>
      <circle cx="31" cy="119" r="8" fill="#f3bc5b"/>
      <text x="52" y="125" fill="#f3d18d" font-family="Arial, sans-serif" font-size="18">32 / 32 players</text>
      <text x="283" y="125" fill="#7894a6" font-family="Arial, sans-serif" font-size="15">PINGING</text>
    </g>
    <g transform="translate(526 112)">
      <rect width="420" height="156" rx="16" fill="#102d2a" stroke="#3fbd8d" stroke-width="2"/>
      <text x="26" y="38" fill="#8edabb" font-family="Arial, sans-serif" font-size="16">AUTOMATION READY</text>
      <text x="26" y="78" fill="#effff8" font-family="Arial, sans-serif" font-size="28" font-weight="700">Slot available</text>
      <circle cx="31" cy="119" r="8" fill="#62e6a7"/>
      <text x="52" y="125" fill="#a7f6d2" font-family="Arial, sans-serif" font-size="18">Connecting now...</text>
      <path d="M350 104l14 14 30-35" fill="none" stroke="#62e6a7" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    </g>
  </g>
</svg>
